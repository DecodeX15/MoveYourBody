targets:
  $default:
    builders:
      freezed:
        options:
          build_extensions:
            "^lib/{{dir}}/model/{{name}}.dart": "lib/{{dir}}/model/generated/{{name}}.freezed.dart"

      source_gen:combining_builder:
        options:
          build_extensions:
            "^lib/{{dir}}/model/{{name}}.dart": "lib/{{dir}}/model/generated/{{name}}.g.dart"